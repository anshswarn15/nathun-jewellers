<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D1600A">
  <title>Nathun Jewellers and Son – Gold &amp; Silver Jewellery, Rajdhanwar</title>
  <meta name="description" content="Nathun Jewellers and Son, Amar Chowk, Rajdhanwar, Jharkhand – gold and silver jewellery for head, neck, ears, hands, feet and body.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- metal gradients used by product illustrations -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-gold22" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="190">
        <stop offset="0" stop-color="#FBE7A1"/><stop offset=".35" stop-color="#E4B33C"/><stop offset=".62" stop-color="#C58E16"/><stop offset="1" stop-color="#F3D27A"/>
      </linearGradient>
      <linearGradient id="g-gold18" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="190">
        <stop offset="0" stop-color="#FCEBC0"/><stop offset=".35" stop-color="#E9BE5C"/><stop offset=".62" stop-color="#D3A03A"/><stop offset="1" stop-color="#F6DC95"/>
      </linearGradient>
      <linearGradient id="g-silver" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="190">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#D2D8DE"/><stop offset=".62" stop-color="#939BA4"/><stop offset="1" stop-color="#E7EAED"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="site-header">
    <div class="wrap hdr-row">
      <button class="icon-btn menu-btn" id="menuBtn" data-i18n-aria="menu" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <a href="#/" class="logo" aria-label="Nathun Jewellers and Son">
        <span class="logo-main" data-i18n="logoMain">NATHUN</span>
        <span class="logo-sub" data-i18n="logoSub">JEWELLERS AND SON</span>
      </a>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" data-i18n-ph="searchPh" data-i18n-aria="search" placeholder="Search jewellery…" aria-label="Search">
      </form>

      <div class="hdr-actions">
        <button class="lang-btn" id="langBtn" type="button">हिंदी</button>
        <button class="bag-btn" id="bagBtn" type="button" aria-label="Bag">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="bag-txt"><span data-i18n="bag">Bag</span> (<span id="bagCount">0</span>)</span>
          <span class="bag-badge" id="bagBadge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="scrim" id="scrim"></div>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="wrap foot-grid">
      <div>
        <h3 class="foot-name" data-i18n="shopName">NATHUN JEWELLERS AND SON</h3>
        <p class="muted" data-i18n="address">Amar Chowk, Rajdhanwar, Jharkhand 825412</p>
        <a class="btn btn-o btn-sm" target="_blank" rel="noopener"
           href="https://www.google.com/maps/dir//NATHUN+JEWELLERS+AND+SON,+Nathun+Jewellers+%26+Sons,+Amar+Chowk,+Rajdhanwar,+Jharkhand+825412/@24.4099752,85.983036,13z/data=!4m8!4m7!1m0!1m5!1m1!1s0x39f3ebc80895b01f:0xf8043a3406e7c703!2m2!1d85.9824294!2d24.412714?entry=ttu&amp;g_ep=EgoyMDI2MTAxMy4wIKXMDSoASAFQAw%3D%3D">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span data-i18n="map">View on Google Maps</span>
        </a>
      </div>
      <div>
        <h4 class="foot-h" data-i18n="callUs">Call Us</h4>
        <a class="call" href="tel:+919955557756"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span><b data-i18n="raj">Raj Kumar Verma</b> · 99555 57756</span></a>
        <a class="call" href="tel:+919939581665"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span><b data-i18n="ashok">Ashok Verma</b> · 99395 81665</span></a>
      </div>
    </div>
    <p class="wrap copy">© <span id="yr"></span> <span data-i18n="shopName">NATHUN JEWELLERS AND SON</span>. <span data-i18n="rights">All rights reserved.</span></p>
  </footer>

  <!-- product details popup -->
  <div class="modal" id="modal" hidden></div>

  <!-- bag drawer -->
  <aside class="drawer" id="bag" aria-label="Bag" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="bagTitle">My Bag</h2>
      <button class="icon-btn" id="bagClose" data-i18n-aria="close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="bagBody"></div>
    <div class="drawer-foot" id="bagFoot"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
